<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.w3.org/1999/xhtml" data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Editar Carro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

<div class="container pt-3">

    <a th:href="@{'/cars/index'}" class="btn btn-primary float-end">Voltar</a>

    <h1>Editar Carro (<span th:text="${car.getModelo()}"></span>)</h1>

    <hr>

    <form method="post"
          th:action="@{|/cars/update/${car.id}|}"
          th:object="${car}">

        <input th:if="${car.id != null}" type="hidden" name="_method" value="put"/>

        <div class="mb-3">

            <label for="marca" class="form-label">Marca</label>

            <input type="text" class="form-control" id="marca" name="marca" th:field="*{marca}">

        </div>

        <div class="mb-3">

            <label for="modelo" class="form-label">Modelo</label>

            <input type="text" class="form-control" id="modelo" name="modelo" th:field="*{modelo}">

        </div>

        <div class="mb-3">

            <label for="ano" class="form-label">Ano</label>

            <input type="number" class="form-control" id="ano" name="ano" th:field="*{ano}">

        </div>

        <button type="submit" class="btn btn-primary">Salvar Alterações</button>

    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
