<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.w3.org/1999/xhtml" data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Detalhes do Carro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<div class="container pt-3">

    <a th:href="@{'/cars/index'}"
       class="btn btn-secondary float-end">
        Voltar para Lista
    </a>

    <h1>Detalhes do Carro</h1>

    <hr>

    <div class="card mt-4" style="max-width: 600px;">

        <div class="card-header">

            <strong>
                Carro #<span th:text="${car.id}">1</span>
            </strong>

        </div>

        <div class="card-body">

            <ul class="list-group list-group-flush">

                <li class="list-group-item">
                    <strong>Marca:</strong>
                    <span th:text="${car.marca}">
                        Toyota
                    </span>
                </li>

                <li class="list-group-item">
                    <strong>Modelo:</strong>
                    <span th:text="${car.modelo}">
                        Corolla
                    </span>
                </li>

                <li class="list-group-item">
                    <strong>Ano:</strong>
                    <span th:text="${car.ano}">
                        2025
                    </span>
                </li>

            </ul>

        </div>

        <div class="card-footer d-flex gap-2">

            <a th:href="@{|/cars/edit/${car.id}|}"
               class="btn btn-primary">

                <i class="bi bi-pencil"></i>
                Editar

            </a>

            <a th:href="@{/cars/delete/{id}(id=${car.id})}"
               class="btn btn-danger">

                <i class="bi bi-trash"></i>
                Excluir

            </a>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>
</html>
